$schema: https://json-schema.org/draft/2020-12/schema
$id: https://verdecito.life/spec/v0.1/channel.schema.yaml
title: Channel
description: A way for the world to reach the instance. Skins may render channels as "doors" or other surface terms.
type: object
required:
  - id
  - type
  - title
  - visibility
  - lifecycle
  - schema_version
properties:
  id:
    type: string
    pattern: "^channel:[a-z0-9-]+:[a-z0-9-]+$"
  type:
    const: channel
  title:
    type: string
  summary:
    type: string
  url:
    type: string
    format: uri
  visibility:
    enum: [public, teaser, private]
  lifecycle:
    enum: [draft, active, archived]
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  created:
    type: string
    format: date
  updated:
    type: string
    format: date
  relationships:
    type: object
    properties:
      asks:
        type: array
        items:
          type: string
      quests:
        type: array
        items:
          type: string
    additionalProperties: false
