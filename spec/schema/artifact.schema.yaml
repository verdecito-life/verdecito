$schema: https://json-schema.org/draft/2020-12/schema
$id: https://verdecito.life/spec/v0.1/artifact.schema.yaml
title: Artifact
description: A produced thing — critique, insight, synthesis, gift, document, or other.
type: object
required:
  - id
  - type
  - title
  - kind
  - visibility
  - lifecycle
  - schema_version
properties:
  id:
    type: string
    pattern: "^artifact:[a-z0-9-]+:[a-z0-9-]+$"
  type:
    const: artifact
  title:
    type: string
  summary:
    type: string
  kind:
    enum: [critique, insight, synthesis, gift, document, other]
  visibility:
    enum: [public, teaser, private]
  lifecycle:
    enum: [draft, active, archived]
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  created:
    type: string
    format: date
  updated:
    type: string
    format: date
  source:
    type: string
  relationships:
    type: object
    properties:
      seeds:
        type: array
        items:
          type: string
      quests:
        type: array
        items:
          type: string
      sprints:
        type: array
        items:
          type: string
    additionalProperties: false
