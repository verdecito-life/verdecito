$schema: https://json-schema.org/draft/2020-12/schema
$id: https://verdecito.life/spec/v0.1/identity.schema.yaml
title: Identity
description: Who the instance is. Values, summary, authorship.
type: object
required:
  - id
  - type
  - title
  - schema_version
properties:
  id:
    type: string
    pattern: "^identity:[a-z0-9-]+$"
  type:
    const: identity
  title:
    type: string
  summary:
    type: string
  values:
    type: array
    items:
      type: string
  authors:
    type: array
    items:
      type: string
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  stability:
    enum: [stable, experimental]
    default: experimental
